[project]
name = "f1-data-analysis"
version = "0.1.0"
description = "F1 analytics and ML platform with FastAPI, Pandas, FastF1, PyTorch, and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.31",
  "pandas>=2.2.2",
  "fastf1>=3.4.0",
  "python-dotenv>=1.0.1",
  "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0"
]

[tool.setuptools]
packages = ["app", "app.core", "app.services", "etl", "ml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
