version: "3.9"

services:
  # Single stateless API service, no separate database container. SQLite lives on the
  # mounted volume below, so there's nothing else to orchestrate for local development.
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persists the FastF1 HTTP cache, the SQLite DB file, and ETL'd processed CSVs
      # across container rebuilds/restarts.
      - ./data:/app/data
